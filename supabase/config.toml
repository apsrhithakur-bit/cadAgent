# Project settings
project_id = "xthmikzaolkfnucpoqyb"

# Edge Functions Configuration
# Disable JWT verification for webhook functions to allow external services like Stripe to call them

[functions.stripe-webhook]
verify_jwt = false

[functions.stripe-webhook-public]
verify_jwt = false

[functions.webhook-test]
verify_jwt = false

# Keep JWT verification enabled for user-facing functions
[functions.manual-sync-profile]
verify_jwt = true

[functions.zoo-text-to-cad]
verify_jwt = false

[functions.create-shared-model]
verify_jwt = false

[functions.get-shared-model]
verify_jwt = false

# Database settings (if needed)
